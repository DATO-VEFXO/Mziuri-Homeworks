        <form>

            <label for="message">მესიჯი:</label>
            <textarea id="message" name="message" placeholder="დახმარება"></textarea>

            <button type="submit">გაგზავნა</button>
        </form>
        <p>ან მოგვწერეთ პირდაპირ: info@travel.com</p>
